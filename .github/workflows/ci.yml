name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The installer relies on Unix fsync/chmod semantics. Windows remains
        # unsupported until the complete validation path has a proven branch.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -B build_manifest.py --check
      - run: python -B -m evaluation smoke
      - run: python -B validate.py
